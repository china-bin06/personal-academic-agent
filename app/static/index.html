<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人学业 Agent</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>个人学业 Agent</h1>
      <p>查询已导入的成绩、课表和培养计划。</p>
      <p id="service-status" role="status">正在检查服务状态……</p>
    </header>

    <section>
      <h2>提问</h2>
      <form id="question-form">
        <label for="question">请输入完整问题</label>
        <textarea id="question" rows="4" maxlength="2000" required
          placeholder="例如：2025-2026学年第1学期最高分和最低分分别是哪门课？"></textarea>
        <p class="hint">查询课表请明确学年、学期和周次；补充条件后请重新提交完整问题。</p>
        <button id="submit-button" type="submit">提交问题</button>
      </form>
      <div id="examples" class="examples">
        <button type="button">2025-2026学年第1学期的平均分、最高分和最低分是多少？</button>
        <button type="button">2026-2027学年第1学期第3周星期五有什么课？</button>
        <button type="button">培养计划各类别还缺多少学分？</button>
        <button type="button">比较2025-2026学年第1学期和第2学期的平均成绩。</button>
      </div>
    </section>

    <section id="result" hidden>
      <h2 id="result-title">回答</h2>
      <div id="answer" aria-live="polite"></div>
      <ul id="warnings"></ul>
      <div id="evidence"></div>
    </section>

    <section>
      <h2>如何更新数据</h2>
      <ol>
        <li>运行对应的采集脚本，必要时在本地浏览器手动登录。</li>
        <li>采集校验通过后，使用已有解析和预览命令核对文件。</li>
        <li>确认内容正确，再运行对应导入命令。</li>
        <li>导入完成后，重新提交问题查询最新数据。</li>
      </ol>
      <p class="hint">“采集校验通过”表示原始文件可用；完成正式导入后，问答才能查询到这些数据。</p>
    </section>
  </main>
</body>
</html>
